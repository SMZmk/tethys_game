<title>Tethys: Desert Drifter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: arcade cabinet — battlefield screen left, two ship dossiers right, command console under the screen. Single dark look on purpose. */
:root{
  --void:#0d0b14; --panel:#17141f; --panel2:#211c2d; --line:#3b3350; --line-hi:#5d5280;
  --ink:#efe6cf; --dim:#9a90b0; --sand:#d8b878;
  --nav:#3fa9f5; --atk:#f0503c; --eng:#f5a623; --any:#e8d04a;
  --good:#5be37a; --bad:#ff4d5e; --p1:#ffcf4a; --p2:#5fd0ff;
  --f-pix:"Press Start 2P", ui-monospace, monospace;
  --f-txt:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-txt);font-size:20px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font-family:var(--f-pix);font-size:10px;line-height:1.3;color:var(--ink);background:var(--panel2);
  border:2px solid var(--line-hi);padding:8px 10px;cursor:pointer;box-shadow:inset -2px -2px 0 #0006, inset 2px 2px 0 #fff1;
  text-transform:uppercase;letter-spacing:.04em}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--any);outline-offset:2px}
button:active:not(:disabled){box-shadow:inset 2px 2px 0 #0006}
button:disabled{opacity:.35;cursor:not-allowed}
button.sel{background:var(--ink);color:var(--void);border-color:var(--ink)}
button.go{background:#2a4a2f;border-color:var(--good)}
button.warn{background:#4a2224;border-color:var(--bad)}
button.nav{border-color:var(--nav)} button.atk{border-color:var(--atk)} button.eng{border-color:var(--eng)}
.pix{font-family:var(--f-pix)}
.app{max-width:1200px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.logo{font-family:var(--f-pix);font-size:16px;letter-spacing:.08em;color:var(--sand);text-shadow:2px 2px 0 #7a3b12}
.logo small{display:block;font-size:8px;color:var(--dim);letter-spacing:.2em;margin-top:6px;text-shadow:none}
.track{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.slot{font-family:var(--f-pix);font-size:9px;padding:6px 8px;border:2px solid var(--line);color:var(--dim);min-width:46px;text-align:center}
.slot.on{color:var(--void)}
.turnchip{font-family:var(--f-pix);font-size:10px;padding:7px 10px;border:2px solid currentColor}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.screen{position:relative;border:3px solid var(--line-hi);background:#000;box-shadow:0 0 0 3px #000, 6px 6px 0 3px #0008;line-height:0}
.screen canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair;touch-action:manipulation}
.hud{position:absolute;left:8px;bottom:8px;font-family:var(--f-pix);font-size:8px;line-height:1.4;color:var(--ink);background:#0d0b14cc;padding:6px 8px;pointer-events:none;max-width:70%}
.hud:empty{display:none}

.console{background:var(--panel);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.prompt{font-family:var(--f-pix);font-size:10px;line-height:1.6;color:var(--sand)}
.prompt .sub{display:block;font-family:var(--f-txt);font-size:20px;color:var(--dim);line-height:1.1;margin-top:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btnrow .lab{font-family:var(--f-pix);font-size:8px;color:var(--dim);min-width:52px}
.split{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.split>*{min-width:0}
.dice{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;flex:1 1 260px}
.die{width:44px;height:44px;flex:none;display:grid;place-items:center;font-family:var(--f-pix);font-size:14px;color:var(--void);background:var(--ink);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.die.d6{clip-path:none;border-radius:0;box-shadow:inset -3px -3px 0 #0004}
.die.rolling{animation:shake .12s steps(2) infinite}
@keyframes shake{0%{transform:translate(-1px,1px) rotate(-6deg)}100%{transform:translate(1px,-1px) rotate(6deg)}}
.formula{font-size:20px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.formula b{font-weight:normal;font-family:var(--f-pix);font-size:9px}
.ok{color:var(--good)} .bad{color:var(--bad)} .dim{color:var(--dim)}
.log{background:#09080e;border:2px solid var(--line);padding:8px 10px;font-size:19px;line-height:1.1;height:150px;overflow-y:auto;display:flex;flex-direction:column-reverse}
.log div{white-space:pre-wrap;overflow-wrap:anywhere}
.eng-grid{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px 10px;align-items:center}
.eng-grid .sys{font-family:var(--f-pix);font-size:9px}

/* ship dossiers */
.ship{background:var(--panel);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.ship.active{border-color:var(--c);box-shadow:4px 4px 0 0 var(--c)}
.ship.dead{opacity:.45}
.ship h3{margin:0;font-family:var(--f-pix);font-size:11px;color:var(--c);display:flex;justify-content:space-between;gap:8px}
.bar{height:12px;background:#2a0f14;border:2px solid #000;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.bar i.lo{background:var(--bad)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/13 - 2px),#0008 calc(100%/13 - 2px) calc(100%/13))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-variant-numeric:tabular-nums}
.stat{background:var(--panel2);padding:3px 5px;font-size:18px;line-height:1}
.stat span{display:block;font-family:var(--f-pix);font-size:7px;color:var(--dim);margin-bottom:3px}
.stat .hurt{color:var(--bad)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flag{font-family:var(--f-pix);font-size:7px;padding:3px 5px;background:#3a2f10;color:var(--any)}
.flag.red{background:#3d1418;color:var(--bad)}
.crew{display:flex;flex-direction:column;gap:6px}
.cm{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 8px;align-items:start;background:var(--panel2);padding:6px;border-left:4px solid var(--st)}
.cm canvas,.card canvas{width:40px;height:40px;image-rendering:pixelated;background:#100e18;border:2px solid #000}
.cm .nm{font-family:var(--f-pix);font-size:8px;line-height:1.5}
.cm .nm em{font-style:normal;color:var(--st)}
.cm .tx{font-size:17px;line-height:1.05;color:var(--dim)}
.cm .tx b{font-weight:normal;color:var(--ink)}
.cm .stt{font-family:var(--f-pix);font-size:7px;text-align:right}
.cm button{padding:5px 6px;font-size:8px;margin-top:4px}
.cm.stun canvas{filter:grayscale(1) brightness(.6)}

/* full screens */
.full{background:var(--panel);border:3px solid var(--line-hi);padding:20px;display:flex;flex-direction:column;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:800px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--f-pix);font-size:clamp(22px,5vw,40px);margin:0;color:var(--sand);text-shadow:4px 4px 0 #7a3b12;letter-spacing:.06em;line-height:1.2}
.hero h1 small{display:block;font-size:11px;color:var(--atk);text-shadow:none;letter-spacing:.3em;margin-top:12px}
.hero p{max-width:60ch;margin:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rule{background:var(--panel2);padding:10px;border-top:4px solid var(--c)}
.rule h4{margin:0 0 6px;font-family:var(--f-pix);font-size:9px;color:var(--c)}
.rule p{margin:0;font-size:18px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel2);border:2px solid var(--st);padding:10px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:6px 10px;text-align:left;font-family:var(--f-txt);font-size:18px;text-transform:none;letter-spacing:0;line-height:1.05}
.card canvas{width:48px;height:48px}
.card .nm{font-family:var(--f-pix);font-size:10px;line-height:1.5}
.card .nm em{display:block;font-style:normal;font-size:8px;color:var(--st)}
.card .full2{grid-column:1/-1;display:flex;flex-direction:column;gap:3px}
.card .k{font-family:var(--f-pix);font-size:7px;color:var(--dim)}
.card.taken{opacity:.25;filter:grayscale(1)}
.picks{display:flex;flex-wrap:wrap;gap:16px}
.picks div{font-family:var(--f-pix);font-size:9px;line-height:1.8}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0d0b14d0;line-height:1.2;padding:12px}
.overlay .box{background:var(--panel);border:3px solid var(--c);padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px}
.overlay h2{font-family:var(--f-pix);font-size:clamp(12px,2.6vw,18px);color:var(--c);margin:0;line-height:1.4}
details.help{background:var(--panel);border:2px solid var(--line);padding:8px 10px}
details.help summary{font-family:var(--f-pix);font-size:9px;cursor:pointer;color:var(--sand)}
details.help ul{margin:8px 0 0;padding-left:20px;font-size:18px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}}
.story{background:linear-gradient(180deg,#1d1626,#15111d);border:2px solid #4a3a5e;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.story h4{margin:0;font-family:var(--f-pix);font-size:8px;color:#c9a0ff;letter-spacing:.12em}
.story p{margin:0;font-size:20px;line-height:1.15;color:#e8dcc0;max-width:70ch}
.story p.old{color:var(--dim);font-size:18px}
.code{width:100%;min-height:72px;resize:vertical;background:#09080e;color:var(--sand);border:2px solid var(--line-hi);font-family:ui-monospace,monospace;font-size:12px;line-height:1.3;padding:6px;overflow-wrap:anywhere}
.code:focus-visible{outline:2px solid var(--any)}
.notation{font-family:ui-monospace,monospace;font-size:13px;line-height:1.4;color:var(--ink);background:#09080e;border:2px solid var(--line);padding:6px 8px;overflow-wrap:anywhere}
.record{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.record div{font-family:ui-monospace,monospace;font-size:12px;line-height:1.35;color:var(--dim);overflow-wrap:anywhere}
.record div b{color:var(--ink);font-weight:normal}
.overlay .box.wide{max-width:560px;width:100%;text-align:left;align-items:stretch}
.overlay .box p{margin:0}
.msg{font-size:18px;color:var(--dim)}
.msg.err{color:var(--bad)}
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.classes{grid-template-columns:minmax(0,1fr)}}
.cls{background:var(--panel2);border:2px solid var(--line-hi);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;font-family:var(--f-txt);font-size:18px;text-transform:none;letter-spacing:0;line-height:1.1}
.cls .nm{font-family:var(--f-pix);font-size:10px;color:var(--sand)}
.cls .nm em{font-style:normal;color:var(--dim);font-size:8px;margin-left:6px}
.cls .row{display:flex;flex-wrap:wrap;gap:4px}
.cls .row span{background:#0d0b14;padding:2px 6px;font-size:16px}
.join{display:flex;flex-direction:column;gap:8px;max-width:640px}
body.busy #console button,body.busy .cm button{cursor:wait}
.arr{font-family:system-ui,"Segoe UI Symbol",sans-serif;font-size:14px;line-height:0;vertical-align:-1px}
.shipimg{width:40px;height:40px;image-rendering:pixelated;flex:none}
.shipimg.big{width:60px;height:60px;background:#100e18;border:2px solid #000}
.shiphead{display:flex;align-items:center;gap:6px}
.shiphead .shipimg{width:28px;height:28px}
.clshead{display:flex;align-items:center;gap:10px}
.cls.picked,.card.picked{outline:3px solid var(--ink);outline-offset:-1px;background:#2c2640}
.cls.fac{border-color:var(--fc)}
.fchip{font-family:var(--f-pix);font-size:7px;padding:3px 5px;background:#0d0b14;color:var(--fc);border:1px solid var(--fc)}
.facgroup{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--fc);padding-left:10px}
.fachead{font-family:var(--f-pix);font-size:9px;color:var(--fc)}
.facs{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.facs{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app" id="app"></div>

<script>
// ======================================================================
// TETHYS RULES CORE  — pure and deterministic, no DOM.
// The whole game is  newGame(seed)  +  apply(G, move)  for every move.
// Two players with the same seed and the same move list see the same game.
// ======================================================================
"use strict";
const R = {
  START_ENERGY:3, START_PARTS:2, START_AMMO:1,
  DC_BASE:8, DC_MOD_EASY:1, DC_MOD_HARD:2, ENG_DIST_BONUS:2, ENG_DC_MULT:0.5,
  BASE_AC:10, AC_DIST:[0,2,4], DMG_BONUS:4, LOCK_DC:8, LOCK_BONUS:4,
  HP_CRIT:0.40, HP_FAIL:0.20, CRASH_DMG:3, REST:2,   // REST = own turns a crew member sits out after an order
};
const DIRS = [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const DIR_NAMES = ["N","NE","SE","S","SW","NW"];
const SYS = [["eng","ENGINE","SPEED"],["bst","BOOST","BOOST"],["dft","DRIFT","DRIFT"],["wpn","WEAPONS","WEAPONS"]];
const SYS_KEYS = {ENG:"eng",BST:"bst",DFT:"dft",WPN:"wpn"};
const DEBUFFS = [["SPEED","SPD"],["BOOST","BST"],["DRIFT","DFT"],["WEAPONS","WPN"],["CREW","CREW"]];
const mod = (a,n)=>((a%n)+n)%n;

// ---------------- HEX MATH ----------------
const hexDist = (q,r)=>(Math.abs(q)+Math.abs(q+r)+Math.abs(r))/2;
function hexRound(q,r){
  const x=q,z=r,y=-x-z; let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return [rx,rz];
}
const RING_CACHE={};
function ring(radius){
  if(RING_CACHE[radius]) return RING_CACHE[radius];
  if(radius===0) return RING_CACHE[0]=[[0,0]];
  let q=DIRS[4][0]*radius, r=DIRS[4][1]*radius; const out=[];
  for(let i=0;i<6;i++) for(let j=0;j<radius;j++){ out.push([q,r]); q+=DIRS[i][0]; r+=DIRS[i][1]; }
  return RING_CACHE[radius]=out;
}
const idxOf=(rg,q,r)=>rg.findIndex(c=>c[0]===q&&c[1]===r);
function navToCoords(dir,side,speed){
  const d=speed+1, rg=ring(d), s=idxOf(rg,DIRS[dir][0]*d,DIRS[dir][1]*d);
  return s<0?[0,0]:rg[mod(s+side,rg.length)];
}
function relInfo(q,r,dir){
  const d=Math.trunc(hexDist(q,r)); if(d===0) return [0,-1];
  const rg=ring(d), s=idxOf(rg,DIRS[dir][0]*d,DIRS[dir][1]*d), t=idxOf(rg,q,r);
  if(s<0||t<0) return [null,null];
  let diff=t-s; const n=rg.length;
  if(diff>n/2) diff-=n; else if(diff<-n/2) diff+=n;
  return [diff,d-1];
}

// ---------------- TERRAIN ----------------
// The arena is centred between the two spawns. Open flats in the middle;
// rock gets denser the further out you drift, but six winding canyons run
// back toward the centre. Salvage wrecks lie in the flats. Nothing stops you
// leaving — the desert just makes coming back the easy way.
const SPAWNS=[[0,5,0],[0,-5,3]];
let T_SEED=1, T_CACHE=new Map(), T_PULL=true;
function setPull(v){ T_PULL=v; T_CACHE=new Map(); }
function setTerrainSeed(seed){ if(seed!==T_SEED){ T_SEED=seed; T_CACHE=new Map(); } }
function noise(q,r,scale,seed){ const v=Math.sin((q/scale)*12.9898+(r/scale)*78.233+seed)*43758.5453; return Math.abs(v-Math.trunc(v)); }
const TERRAIN_NAMES=["Open sand","Slate rock","Rust mesa","Tar pit","Old-world wreck"];
function terrain(q,r){
  const k=(q+4096)*8192+(r+4096); let v=T_CACHE.get(k); if(v!==undefined) return v;
  v=computeTerrain(q,r); T_CACHE.set(k,v); return v;
}
function computeTerrain(q,r){
  const so=(T_SEED%9973)/131.7, d=hexDist(q,r);
  if(d<=2) return 0;
  for(const [sq,sr] of SPAWNS) if(hexDist(q-sq,r-sr)<=1) return 0;
  if(T_PULL&&d>=3&&d<=8&&noise(q,r,1,77.7+so)>0.955) return 4;
  let th=T_PULL?0.72-Math.min(0.40,Math.max(0,(d-8)*0.05)):0.72;
  if(T_PULL&&d>=5&&d<=16){
    const x=1.5*q, y=Math.sqrt(3)/2*q+Math.sqrt(3)*r;
    const rot=(T_SEED%360)*Math.PI/180, a=Math.atan2(y,x)-rot;
    const wiggle=Math.sin(d*0.7+so)*0.18;
    const gap=Math.abs(mod(a+wiggle+Math.PI/6,Math.PI/3)-Math.PI/6);
    if(gap*d<1.1) th=0.97;
  }
  const c=noise(q,r,5,0.123+so)*0.7+noise(q,r,1.5,9.876+so)*0.3;
  if(c<=th) return 0;
  const b=noise(q,r,15,42.1337+so); return b<0.33?1:b<0.66?2:3;
}
const isObstacle=(q,r)=>{ const t=terrain(q,r); return t>=1&&t<=3; };
function angleDifficulty(dir,tq,tr,sq,sr){
  if(isObstacle(sq+tq,sr+tr)) return [0,false];
  const [side,speed]=relInfo(tq,tr,dir);
  if(side===null) return [0,true];
  const d=speed+1; if(d===0) return [0,true];
  const dev=Math.abs(side)/d;
  if(dev<0.5) return [0,true]; if(dev<=1) return [R.DC_MOD_EASY,true]; if(dev<=1.5) return [R.DC_MOD_HARD,true];
  return [0,false];
}

// ---------------- FACTIONS, SHIPS & CREW ----------------
// Every ship sails under a faction; every crew member belongs to one.
// Kindred: each crew member who shares the ship's faction adds +2 hull.
const FACTIONS = {
  MACHINE:{name:"Scrappers",long:"Followers of the Machine",color:"#d0743a",
    perk:"Repairs heal +1",creed:"The ship is the living body. The crew are its servants."},
  HEART:{name:"Nomads",long:"Followers of the Heart",color:"#e0607e",
    perk:"Crew orders rest only 1 turn",creed:"The crew is the heart. No one is left in the sand."},
  WIND:{name:"Drifters",long:"Followers of the Wind",color:"#7fd8c8",
    perk:"+1 to boost and drift rolls",creed:"Free as the wind, owned by no one, lost never."},
};
const KINDRED_HULL=1;
const CLASSES = {
  SKIFF:{name:"Skiff",role:"Runner",size:"Small",hull:15,energy:3,parts:2,bst:1,dft:1,atk:0,dmg:0,rep:0,
    text:"Twin-hull racer. +1 to boost and drift rolls.",lore:"A sand-catamaran: two knife hulls, one big engine, no armour."},
  HAULER:{name:"Hauler",role:"Fortress",size:"Huge",hull:15,energy:3,parts:3,bst:-1,dft:0,atk:0,dmg:0,rep:0,
    text:"Mobile fortress. +1 spare part, −1 to boost rolls.",lore:"A diesel barge with smokestacks that carries a whole camp on its back."},
  DREAD:{name:"Dreadnought",role:"Ripper",size:"Large",hull:15,energy:3,parts:1,bst:0,dft:0,atk:1,dmg:1,rep:0,
    text:"Gunboat. +1 attack, +1 damage, one fewer part.",lore:"Riveted armour, a turret and a stack that never stops smoking."},
  RELIC:{name:"Construct",role:"Relic",size:"Medium",hull:15,energy:5,parts:2,bst:0,dft:0,atk:0,dmg:0,rep:-1,
    text:"Old-world tech. 5 energy, repairs −1.",lore:"Nobody knows who built it. It hums when the wind dies."},
};
// f = faction, st = station (phase where the order works)
const CREW = [
  // Followers of the Machine — Scrappers
  {key:"IRONCAPT",f:"MACHINE",name:"VOSS",role:"Iron Captain",st:"ANY",passive:"+1 attack rolls",order:"Scrap Fury",text:"Your next hit this turn deals +4",pal:["#c89878","#303038","#4a3a30","#e86a20"]},

// ---------------- RNG (seeded, part of the game state) ----------------
function rnd(G,n){
  let t=(G.rng=(G.rng+0x6D2B79F5)>>>0);
  t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
  const u=((t^(t>>>14))>>>0)/4294967296;
  return 1+Math.floor(u*n);
}
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }

// ---------------- STATE ----------------
function newShip(pid,q,r,o){
  return {pid,cls:null,fac:null,q,r,o,hp:26,maxHp:26,baseEnergy:R.START_ENERGY,parts:R.START_PARTS,ammo:R.START_AMMO,
    sys:{eng:0,bst:0,dft:0,wpn:0},dmg:{SPEED:0,BOOST:0,DRIFT:0,WEAPONS:0},
    f:{targeted:false,reloaded:false,fired:false,drift:false,locked:false,debuff:null},
    crew:[],evasive:false,jammed:false,surge:0,autoBoost:false,
    fury:false,tailwind:false,chain:false,storm:false,brace:false};
}
function newGame(seed){
  seed=(seed>>>0)||1; setTerrainSeed(seed);
  const G={v:2,seed,rng:seed,moves:[],ships:SPAWNS.map((s,i)=>newShip(i+1,s[0],s[1],s[2])),active:0,
    draft:{pool:CREW.map(c=>c.key),order:[0,1,1,0,0,1],idx:0},
    phase:"DRAFT",queue:[],qi:0,repeated:false,st:"draft",target:null,dc:0,aim:null,
    roll:null,winner:null,looted:[],turn:0,log:[],story:[],ev:[]};
  tell(G,"open",{});
  return G;
}
const S=G=>G.ships[G.active];
const other=(G,s)=>G.ships.find(x=>x!==s);
const tgt=G=>G.ships.find(x=>x.pid===G.target)||null;
const shipName=s=>"P"+s.pid;
function actor(G){ if(G.st==="over") return -1; return G.st==="draft"?G.draft.order[G.draft.idx]:G.active; }
function log(G,t,c=""){ G.log.unshift({t,c}); if(G.log.length>80) G.log.pop(); }
function ev(G,e){ G.ev.push(e); }

const cls=s=>CLASSES[s.cls]||{bst:0,dft:0,atk:0,dmg:0,rep:0};
const has=(s,key)=>s.crew.some(c=>c.key===key&&!c.stun);
function energyCap(s){ const p=s.hp/s.maxHp; if(p<R.HP_FAIL) return 0; if(p<R.HP_CRIT) return 1; return s.baseEnergy+(has(s,"TECH")?1:0); }
const energyUsed=s=>s.sys.eng+s.sys.bst+s.sys.dft+s.sys.wpn;
const hullPen=s=>(s.hp/s.maxHp<R.HP_FAIL?-1:0);
const effEngine=s=>Math.max(0,s.sys.eng-s.dmg.SPEED);
function integrity(G,s){
  const cap=energyCap(s);
  if(energyUsed(s)>cap){
    log(G,`${shipName(s)} power failure! Cap dropped to ${cap}.`,"bad");
    s.sys={eng:0,bst:0,dft:0,wpn:0};
    if(cap===1){ s.sys.eng=1; log(G,"Emergency power to engines."); }
  }
}
function crewMods(s,kind,target,consume){
  const m=[];
  if(has(s,"CAPTAIN")) m.push([1,"RHO"]);
  if(kind==="ATK"&&has(s,"IRONCAPT")) m.push([1,"VOSS"]);
  if((kind==="BOOST"||kind==="DRIFT")&&s.fac==="WIND") m.push([1,"Drifters"]);
  if(s.storm) m.push([-2,"sandstorm"]);
  if(kind==="BOOST"&&has(s,"ACE")) m.push([2,"VEX"]);
  if(kind==="DRIFT"&&has(s,"DRIFTER")) m.push([2,"ORO"]);
  if(kind==="ATK"&&has(s,"GUNNER")) m.push([2,"KAEL"]);
  if(kind==="LOCK"&&has(s,"SPOTTER")) m.push([3,"NYX"]);
  if(s.surge>0){ m.push([s.surge,"surge"]); if(consume) s.surge=0; }
  if(target){
    if(kind==="LOCK"&&has(target,"JAMMER")) m.push([-2,"jammer"]);
    if(kind==="ATK"&&target.evasive) m.push([-3,"evasive"]);
    if(kind==="ATK"&&has(target,"BULWARK")) m.push([-1,"DOV"]);
  }
  return m;
}
function rollCheck(G,label,sides,mods,vs,vsLabel,pid){
  const v=rnd(G,sides), m=mods.filter(x=>x[0]!==0), total=v+m.reduce((a,x)=>a+x[0],0), ok=total>=vs;
  G.roll={label,sides,die:v,mods:m,total,vs:`${vsLabel} ${vs}`,ok,pid};
  log(G,`${label}: d${sides} ${v}${m.map(x=>` ${x[0]>0?"+":""}${x[0]} ${x[1]}`).join("")} = ${total} vs ${vsLabel} ${vs}`,ok?"ok":"bad");
  ev(G,{t:"roll",roll:{...G.roll}});
  return ok;
}

function tell(G,key,vars,fac){
  const opts=(fac&&FACTION_TALES[fac]&&FACTION_TALES[fac][key])||TALES[key]; if(!opts) return;
  const h=hashStr(G.seed+":"+G.moves.length+":"+G.story.length+":"+key);
  let t=opts[h%opts.length];
  for(const k in vars) t=t.split("{"+k+"}").join(vars[k]);
  G.story.unshift(t); if(G.story.length>40) G.story.pop();
  ev(G,{t:"story",text:t});
}
const cname=s=>s.cls?`P${s.pid}'s ${CLASSES[s.cls].name.toLowerCase()}`:`P${s.pid}`;
const kindred=s=>s.crew.filter(c=>CREW_BY[c.key].f===s.fac).length;

// ---------------- TURN FLOW ----------------
function startTurn(G,idx){
  G.active=idx; const s=S(G); G.turn++;
  s.f={targeted:false,reloaded:false,fired:false,drift:false,locked:false,debuff:null};
  s.evasive=false; s.brace=false; s.crew.forEach(c=>{ if(c.rest>0) c.rest--; });
  if(has(s,"MEDIC")&&s.crew.some(c=>c.stun)){ s.crew.forEach(c=>c.stun=false); log(G,`ANA tends the wounded: ${shipName(s)} crew back on their feet.`,"ok"); }
  G.repeated=false; G.phase="CMD"; G.queue=[]; G.qi=0; G.st="cmd"; G.target=null; G.roll=null; G.aim=null;
  log(G,`— Turn ${G.turn}: Player ${s.pid} —`,"p"+s.pid);
  if(s.jammed) log(G,`${shipName(s)} comms jammed: only 2 phases.`,"bad");
  if(s.storm) log(G,`${shipName(s)} is caught in a sandstorm: −2 to all rolls this turn.`,"bad");
  integrity(G,s);
  const o=other(G,s);
  tell(G,hexDist(o.q-s.q,o.r-s.r)<=4?"turnNear":"turnFar",{p:cname(s)},s.fac);
  ev(G,{t:"turn",pid:s.pid});
}
function endTurn(G){
  const s=S(G);
  s.jammed=false; s.surge=0; s.autoBoost=false; s.fury=false; s.tailwind=false; s.chain=false; s.storm=false; s.crew.forEach(c=>c.stun=false);
  startTurn(G,G.ships.indexOf(other(G,s)));
}
const slotsAllowed=G=>S(G).jammed?2:3;
function beginPhase(G,i){
  G.qi=i; G.phase=G.queue[i]; G.target=null; G.aim=null; const s=S(G);
  if(G.phase==="NAV") G.st="nav_pick";
  if(G.phase==="ATK"){ Object.assign(s.f,{targeted:false,reloaded:false,fired:false,locked:false,debuff:null}); G.st="atk_acquire"; }
  if(G.phase==="ENG") G.st="eng";
}
function endPhase(G){ if(G.qi+1<G.queue.length) beginPhase(G,G.qi+1); else endTurn(G); }

function navOption(s,speed,side){
  const ee=effEngine(s), total=speed+ee*R.ENG_DIST_BONUS;
  const [rq,rr]=navToCoords(s.o,side,total-1);
  const [m,ok]=angleDifficulty(s.o,rq,rr,s.q,s.r);
  if(!ok) return null;
  return {speed,side,q:s.q+rq,r:s.r+rr,dc:Math.trunc((R.DC_BASE+total+m)*(1+ee*R.ENG_DC_MULT))-(s.tailwind?4:0)};
}
function allNavOptions(s){ const o=[]; for(let sp=1;sp<=3;sp++) for(let sd=-3;sd<=3;sd++){ const x=navOption(s,sp,sd); if(x) o.push(x);} return o; }
function arcInfo(s,t){
  if(!t||t.hp<=0) return null;
  const [side,sp]=relInfo(t.q-s.q,t.r-s.r,s.o);
  if(side===null||sp<0||sp>2||Math.abs(side)>3) return null;
  return {range:sp+1,side};
}
function arcHexes(s){ const h=[]; for(let d=1;d<=3;d++) for(let sd=-3;sd<=3;sd++){ const [q,r]=navToCoords(s.o,sd,d-1); h.push([s.q+q,s.r+r]); } return h; }

function damage(G,s,n){
  s.hp=Math.max(0,s.hp-n); ev(G,{t:"hit",pid:s.pid,n});
  if(s.hp===0) log(G,`${shipName(s)} hull breached — ship lost!`,"bad");
  else { log(G,`${shipName(s)} takes ${n} damage (${s.hp} left).`,"bad"); integrity(G,s); }
}
function checkWin(G){
  const alive=G.ships.filter(s=>s.hp>0);
  if(alive.length<=1){
    G.winner=alive[0]?alive[0].pid:0; G.st="over"; G.phase="OVER";
    if(alive[0]) tell(G,"win",{p:cname(alive[0])},alive[0].fac);
    return true;
  }
  return false;
}
function stunCrew(G,t,by){
  const pool=t.crew.filter(c=>!c.stun);
  if(!pool.length){ log(G,"No crew left to stun."); return; }
  const c=pool[rnd(G,pool.length)-1]; c.stun=true;
  log(G,`Crew hit: ${shipName(t)} ${CREW_BY[c.key].name} stunned!`,"bad");
  tell(G,"stun",{p:cname(by),t:cname(t),c:CREW_BY[c.key].name},by.fac);
}

function orderBlock(G,s,c){
  const d=CREW_BY[c.key];
  if(G.st==="over"||s!==S(G)||G.st==="draft") return "Not your turn";
  if(c.stun) return "Stunned";
  if(c.rest>0) return `Resting ${c.rest}`;
  if(G.phase==="CMD") return "Plan phases first";
  if(d.st!=="ANY"&&d.st!==G.phase) return `${d.st} phase only`;
  const t=tgt(G);
  switch(c.key){
    case "CAPTAIN": return G.repeated?"Already repeated":null;
    case "ACE": return G.st!=="nav_pick"?"Use before boost":s.autoBoost?"Primed":null;
    case "DRIFTER": return s.evasive?"Active":null;
    case "GUNNER": return null;
    case "SPOTTER": return G.st!=="atk_menu"?"Acquire target":s.f.targeted?"Lock spent":null;
    case "JAMMER": return !t?"Acquire target":t.jammed?"Already jammed":null;
    case "MECHANIC": return Object.values(s.dmg).some(v=>v>0)?null:"No damage";
    case "TECH": return s.surge?"Primed":null;
    case "QM": return null;
    case "IRONCAPT": return s.fury?"Primed":null;
    case "HARPOON": return s.chain?"Primed":null;
    case "BULWARK": return s.brace?"Active":null;
    case "ECO": { const o=other(G,s); return o.storm?"Already in a storm":null; }
    case "MEDIC": return s.hp>=s.maxHp?"Hull is full":null;
    case "WINDCAPT": return G.st!=="nav_pick"?"Use before boost":s.tailwind?"Primed":null;
  }
  return null;
}

// ---------------- LEGAL MOVES ----------------
function legal(G){
  const L=[];
  if(G.st==="over") return L;
  if(G.st==="draft"){
    const s=G.ships[actor(G)];
    if(!s.cls) for(const k in CLASSES) for(const f in FACTIONS) L.push("C:"+k+":"+f);
    else for(const k of G.draft.pool) L.push("R:"+k);
    return L;
  }
  const s=S(G);
  if(G.phase!=="CMD") s.crew.forEach((c,i)=>{ if(!orderBlock(G,s,c)) L.push("O:"+(i+1)); });
  switch(G.st){
    case "cmd": for(const p of ["NAV","ATK","ENG"]) if(!G.queue.includes(p)) L.push("Q:"+p); if(G.queue.length) L.push("Q-"); break;
    case "nav_pick": {
      const opts=allNavOptions(s);
      for(const o of opts) L.push(`B:${o.speed}:${o.side>0?"+":""}${o.side}`);
      if(!opts.length) L.push("PIVOT:L","PIVOT:R");
      L.push("END"); break; }
    case "nav_drift": L.push("DRIFT"); break;
    case "nav_heading": for(const d of DIR_NAMES) L.push("H:"+d); break;
    case "done": L.push("END"); break;
    case "atk_acquire": if(arcInfo(s,other(G,s))) L.push("TGT"); if(!s.f.reloaded) L.push("RLD"); L.push("END"); break;
    case "atk_menu": {
      const t=tgt(G);
      if(!s.f.targeted&&!s.f.reloaded&&s.f.drift) L.push("LOCK");
      if(!s.f.targeted&&!s.f.reloaded) L.push("RLD");
      if(!s.f.fired&&s.ammo>0&&arcInfo(s,t)) L.push("FIRE");
      L.push("END"); break; }
    case "atk_debuff": for(const [k] of DEBUFFS) L.push("AIM:"+k); break;
    case "atk_dmg": L.push("DMG"); break;
    case "eng": {
      const cap=energyCap(s), used=energyUsed(s);
      for(const [k,lab] of SYS){ const K=Object.keys(SYS_KEYS).find(x=>SYS_KEYS[x]===k);
        if(used<cap&&!(k==="eng"&&s.sys.eng>=2)) L.push("+"+K);

// ---------------- APPLY ----------------
function apply(G,a){
  if(!legal(G).includes(a)) throw new Error("Illegal move: "+a+" (state "+G.st+")");
  G.moves.push(a); G.ev=[];
  if(a.startsWith("O:")) { useOrder(G,+a.slice(2)-1); return G; }
  const [head,arg,arg2]=a.split(":");
  switch(G.st){
    case "draft": draftMove(G,head,arg,arg2); break;
    case "cmd":
      if(a==="Q-") G.queue.pop();
      else { G.queue.push(arg); if(G.queue.length===slotsAllowed(G)){ log(G,"Plan: "+G.queue.join(" → ")); beginPhase(G,0); } }
      break;
    case "nav_pick":
      if(a==="END"){ endPhase(G); break; }
      if(head==="PIVOT"){ const s=S(G); s.o=mod(s.o+(arg==="L"?-1:1),6); log(G,`Pivot in place to ${DIR_NAMES[s.o]}.`); G.st="done"; break; }
      doBoost(G,+arg,+arg2); break;
    case "nav_drift": doDrift(G); break;
    case "nav_heading": S(G).o=DIR_NAMES.indexOf(arg); log(G,`Heading locked: ${arg}.`); G.st="done"; break;
    case "done": endPhase(G); break;
    case "atk_acquire": case "atk_menu":
      if(a==="END"){ endPhase(G); break; }
      if(a==="TGT"){ const t=other(G,S(G)); G.target=t.pid; G.st="atk_menu"; log(G,`Target acquired: ${shipName(t)}.`,"ok"); break; }
      if(a==="RLD"){ const s=S(G); s.ammo=Math.max(s.ammo,has(s,"QM")?2:1); s.f.reloaded=true; log(G,`Reloaded. Ammo ${s.ammo}.`); break; }
      if(a==="LOCK"){ doLock(G); break; }
      if(a==="FIRE"){ doFire(G); break; }
      break;
    case "atk_debuff": { const s=S(G); s.f.debuff=arg; s.f.targeted=true; log(G,`Aiming at enemy ${arg.toLowerCase()}.`); G.st="atk_menu"; break; }
    case "atk_dmg": doDamage(G); break;
    case "eng": {
      const s=S(G);
      if(a==="END"){ endPhase(G); break; }
      if(a==="REP"){ doRepair(G); break; }
      const k=SYS_KEYS[a.slice(1)]; s.sys[k]+=a[0]==="+"?1:-1; break; }
  }

}
function draftMove(G,head,key,fac){
  const s=G.ships[actor(G)];
  if(head==="C"){
    const c=CLASSES[key]; s.cls=key; s.fac=fac; s.maxHp=s.hp=c.hull; s.baseEnergy=c.energy; s.parts=c.parts;
    log(G,`P${s.pid} takes a ${c.name} under the ${FACTIONS[fac].name}.`,"p"+s.pid); return;
  }
  G.draft.pool=G.draft.pool.filter(k=>k!==key); s.crew.push({key,rest:0,stun:false});
  if(key==="QM") s.parts++;
  log(G,`P${s.pid} recruits ${CREW_BY[key].name} (${CREW_BY[key].role}).`,"p"+s.pid);
  G.draft.idx++;
  if(G.draft.idx>=G.draft.order.length){
    for(const sh of G.ships){ const k=kindred(sh); if(k){ sh.maxHp+=k*KINDRED_HULL; sh.hp=sh.maxHp; log(G,`P${sh.pid} kindred crew: ${k} × +${KINDRED_HULL} hull.`,"p"+sh.pid); } }
    startTurn(G,0);
  }
}
function doBoost(G,speed,side){
  const s=S(G), opt=navOption(s,speed,side);
  G.dc=opt.dc; G.aim={q:opt.q,r:opt.r}; if(s.tailwind){ s.tailwind=false; log(G,"Tailwind: boost DC −4.","ok"); }
  let ok;
  if(s.autoBoost){ s.autoBoost=false; ok=true; G.roll={label:"BOOST",sides:20,auto:true,ok:true,vs:"DC "+opt.dc,pid:s.pid}; ev(G,{t:"roll",roll:{...G.roll}}); log(G,"Afterburn! Boost auto-succeeds.","ok"); }
  else ok=rollCheck(G,"BOOST",20,[[s.sys.bst,"BST"],[cls(s).bst,"hull class"],[hullPen(s),"hull"],[-s.dmg.BOOST,"dmg"],...crewMods(s,"BOOST",null,true)],opt.dc,"DC",s.pid);
  let dest;
  if(ok){ log(G,"Boost success.","ok"); dest={q:opt.q,r:opt.r}; tell(G,"boostOk",{p:cname(s)},s.fac); }
  else { log(G,"Boost failed! Overshooting +50%.","bad"); const [q,r]=hexRound(s.q+(opt.q-s.q)*1.5, s.r+(opt.r-s.r)*1.5); dest={q,r}; tell(G,"boostFail",{p:cname(s)},s.fac); }

  s.q=dest.q; s.r=dest.r;
  const tt=terrain(s.q,s.r);
  if(isObstacle(s.q,s.r)){ log(G,`${shipName(s)} crashed into ${TERRAIN_NAMES[tt].toLowerCase()}!`,"bad"); tell(G,"crash",{p:cname(s)},s.fac); damage(G,s,has(s,"ECO")?1:R.CRASH_DMG); }

}
function doDrift(G){
  const s=S(G);
  const ok=rollCheck(G,"DRIFT",20,[[s.sys.dft,"DFT"],[cls(s).dft,"hull class"],[hullPen(s),"hull"],[-s.dmg.DRIFT,"dmg"],...crewMods(s,"DRIFT",null,true)],G.dc,"DC",s.pid);
  s.f.drift=ok;
  if(ok){ log(G,"Drift stable. Set your heading.","ok"); G.st="nav_heading"; tell(G,"driftOk",{p:cname(s)},s.fac); }
  else if(has(s,"WINDCAPT")){ log(G,"Drift failed, but SELA keeps the helm. Set your heading (no lock-on this turn).","bad"); tell(G,"driftFail",{p:cname(s)},s.fac); G.st="nav_heading"; }
  else { s.o=mod(s.o+(rnd(G,2)===1?-1:1),6); log(G,`Drift failed — spun out to ${DIR_NAMES[s.o]}.`,"bad"); tell(G,"driftFail",{p:cname(s)},s.fac); G.st="done"; }
}
function doLock(G){
  const s=S(G), t=tgt(G);
  const ok=rollCheck(G,"LOCK",20,[[s.sys.wpn,"WPN"],[-s.dmg.WEAPONS,"dmg"],...crewMods(s,"LOCK",t,true)],R.LOCK_DC,"DC",s.pid);
  if(ok){ s.f.locked=true; log(G,"Lock confirmed. Pick a system to cripple.","ok"); G.st="atk_debuff"; }
  else { s.f.targeted=true; log(G,"Lock failed.","bad"); G.st="atk_menu"; }
}
function doFire(G){
  const s=S(G), t=tgt(G), ai=arcInfo(s,t);

  ev(G,{t:"shot",from:s.pid,to:t.pid,hit:ok});
  if(ok){ log(G,"Hit! Roll damage.","ok"); G.st="atk_dmg"; }
  else { log(G,"Shot missed.","bad"); tell(G,"miss",{p:cname(s),t:cname(t)},s.fac); ev(G,{t:"miss",pid:t.pid}); s.f.locked=false; s.f.debuff=null; G.st="atk_menu"; }
}
function doDamage(G){
  const s=S(G), t=tgt(G);
  const v=rnd(G,6), mods=[[R.DMG_BONUS,"base"],[s.sys.wpn,"WPN"],[cls(s).dmg,"hull class"],[-s.dmg.WEAPONS,"dmg"],
    [has(s,"HARPOON")?1:0,"GRIT"],[s.fury?4:0,"fury"],[t.brace?-3:0,"brace"]].filter(x=>x[0]!==0);
  s.fury=false;
  const n=Math.max(1,v+mods.reduce((a,x)=>a+x[0],0));
  G.roll={label:"DAMAGE",sides:6,die:v,mods,total:n,dmg:true,pid:s.pid};
  ev(G,{t:"roll",roll:{...G.roll}});
  tell(G,"hit",{p:cname(s),t:cname(t)},s.fac);
  damage(G,t,n);
  if(t.hp>0&&s.chain){ s.chain=false; const k=["SPEED","BOOST","DRIFT","WEAPONS"][rnd(G,4)-1]; t.dmg[k]++; log(G,`Chain shot: ${shipName(t)} ${k.toLowerCase()} −1.`,"bad"); tell(G,"crit",{t:cname(t),s:k.toLowerCase()},t.fac); }
  if(t.hp>0&&s.f.debuff){
    if(s.f.debuff==="CREW") stunCrew(G,t,s);
    else { t.dmg[s.f.debuff]++; log(G,`Critical: ${shipName(t)} ${s.f.debuff.toLowerCase()} −1.`,"bad"); tell(G,"crit",{t:cname(t),s:s.f.debuff.toLowerCase()},t.fac); }

}
function doRepair(G){
  const s=S(G);

  ev(G,{t:"roll",roll:{...G.roll}});

}
function useOrder(G,i){

    case "ACE": s.autoBoost=true; break;
    case "DRIFTER": s.evasive=true; break;
    case "GUNNER": s.ammo++; s.f.fired=false; break;
    case "SPOTTER": s.f.locked=true; G.st="atk_debuff"; break;
    case "JAMMER": tgt(G).jammed=true; break;
    case "MECHANIC": for(const k in s.dmg) s.dmg[k]=Math.max(0,s.dmg[k]-1); break;
    case "TECH": s.surge=5; break;
    case "QM": s.parts+=2; break;
    case "IRONCAPT": s.fury=true; break;
    case "HARPOON": s.chain=true; break;
    case "BULWARK": s.brace=true; break;
    case "ECO": other(G,s).storm=true; break;
    case "MEDIC": { const h=Math.min(3,s.maxHp-s.hp); s.hp+=h; log(G,`ANA patches ${h} hull.`,"ok"); integrity(G,s); break; }

}

// ---------------- RECORD / NOTATION ----------------
// Moves are grouped into "plies": consecutive moves by the same player.
function replay(seed,moves){ const G=newGame(seed); for(const m of moves) apply(G,m); G.ev=[]; return G; }
function plies(seed,moves){
  const G=newGame(seed), out=[]; let cur=null;

    const who=actor(G);

    cur.moves.push(m); apply(G,m);

}
function plyText(p){ return p.moves.join(" ").replace(/Q:(\w+) Q:(\w+)(?: Q:(\w+))?/,(m,a,b,c)=>"Q:"+[a,b,c].filter(Boolean).join(",")); }

<script>
// ======================================================================
// TETHYS UI — rendering, input, online move codes. Game rules live in logic.js.
// ======================================================================
"use strict";
let G=null;
let MODE={mode:"local",seat:0};                 // local hotseat, or online with my seat (0/1)
const UI={screen:"title",speed:1,side:0,handoff:false,busy:false,rolling:null,shown:null,
  focus:null,heading:null,pickCls:null,pickFac:null,pickCrew:null,share:null,shareText:"",msg:"",msgErr:false,joinMsg:"",lastSeenTurn:0};
const SAVE_KEY="tethys.v2";
const P_COLORS=["#ffcf4a","#5fd0ff"];
const ST_COLOR={NAV:"var(--nav)",ATK:"var(--atk)",ENG:"var(--eng)",ANY:"var(--any)"};
const PORTRAIT=["...hhhhhh...","..hhhhhhhh..",".hhhsssshhh.",".hhssssssh..","..sesssesa..","..ssssssss..",
  "...ssaass...","....ssss....","..uuuaauuu..",".uuuuaauuuu.","uuuauuuuauuu","uuuuuuuuuuuu"];
const HP_LOW=0.4;
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,reduceMotion()?Math.min(ms,60):ms));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------------- SAVE / LOAD ----------------
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify({seed:G.seed,moves:G.moves,mode:MODE.mode,seat:MODE.seat,share:UI.share,shareText:UI.shareText})); }catch(e){} }
function loadSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); return d&&d.seed?d:null; }catch(e){ return null; } }
function restore(d){
  try{ G=replay(d.seed,d.moves); }catch(e){ G=null; return false; }
  MODE={mode:d.mode||"local",seat:d.seat||0}; UI.share=d.share||null; UI.shareText=d.shareText||"";
  UI.screen="game"; UI.handoff=false; UI.lastSeenTurn=G.turn; return true;
}

// ---------------- MOVE CODES ----------------
// A code holds the seed and the whole move list, so it always resyncs both games.
const b64u={enc:b=>{ let s=""; for(const x of b) s+=String.fromCharCode(x); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },

async function decodeGame(text){

async function makeShare(){

}

// ---------------- PLAYING MOVES ----------------
async function act(m){

  const before=actor(G);
  apply(G,m); const evs=G.ev; G.ev=[]; UI.heading=null; UI.pickCls=null; UI.pickFac=null; UI.pickCrew=null;

async function present(evs){

        { const t0=performance.now(); while(performance.now()-t0<(reduceMotion()?60:480)){ UI.rolling.shown=1+Math.floor(Math.random()*e.roll.sides); paintDice(); await new Promise(r=>setTimeout(r,60)); } }

      case "hit": fx.hit(e.pid,e.n); await sleep(260); break;
      case "miss": fx.text(e.pid,"MISS","#d8d0f0"); break;
      case "order": fx.text(e.pid,e.text.toUpperCase(),"#ffe066"); await sleep(200); break;
      case "story": paintStory(e.text); await sleep(120); break;

}
async function importCode(text){
  UI.msg=""; UI.msgErr=false; UI.joinMsg="";

    // new game from a friend's code: catch up silently, then watch their latest move
    let last, G2;
    try{ const ps=plies(d.seed,d.moves); last=ps.length?ps[ps.length-1].moves.length:0; G2=replay(d.seed,d.moves.slice(0,d.moves.length-last)); }
    catch(e){ return fail("This code contains an illegal move. It may be damaged, or from a different version of the game."); }

  } else {
    const n=G.moves.length;

}

const W=384,H=264,HS=11,SQ3=Math.sqrt(3);

  if(UI.screen==="title"||!G) return renderTitle();

}

  <div style="display:flex;flex-direction:column;gap:14px"><p>The old world is sand and scrap. Somewhere beyond the dunes lies Europa. Two ships have heard the same rumour of a relic that points the way, and only one will carry it home.</p>

function waitingPanel(){
  const s=G.ships[actor(G)];

    ${UI.share?`<textarea id="share-code" class="code" readonly>${esc(UI.shareText)}</textarea><div class="btnrow"><button class="go" data-ui="copy" id="btn-copy">Copy move</button><span class="msg" id="copy-msg"></span></div>`:""}
    <textarea id="reply-code" class="code" placeholder="Paste their move code here"></textarea>
    <div class="btnrow"><button data-ui="reply" id="btn-reply">Load their move</button><span class="msg ${UI.msgErr?"err":""}">${esc(UI.msg)}</span></div></div>`;
}
function canUndo(){
  if(!G||UI.busy||!G.moves.length) return false;
  const last=G.moves[G.moves.length-1];
  if(!/^[CR]:/.test(last)) return false;
  if(MODE.mode==="local") return true;
  const prev=replay(G.seed,G.moves.slice(0,-1));
  return actor(prev)===MODE.seat&&actor(G)===MODE.seat;      // online: only inside your own, unsent turn
}
function undoLast(){
  if(!canUndo()) return;
  G=replay(G.seed,G.moves.slice(0,-1)); UI.pickCrew=null; UI.handoff=false; save();
}
const facChip=f=>f?`<span class="fchip" style="--fc:${FACTIONS[f].color}">${FACTIONS[f].name.toUpperCase()}</span>`:"";

      <span class="nm" style="color:${f.color}">${f.name.toUpperCase()}<em>${esc(f.long.toUpperCase())}</em></span><span>${esc(f.perk)}</span><span class="dim">“${esc(f.creed)}”</span>

    ${Object.entries(FACTIONS).map(([fk,f])=>`<div class="facgroup" style="--fc:${f.color}"><div class="fachead">${f.name.toUpperCase()} <span class="dim">· ${esc(f.long)}${fk===s.fac?" · YOUR FACTION":""}</span></div>
      <div class="cards">${CREW.filter(c=>c.f===fk).map(c=>{ const taken=!G.draft.pool.includes(c.key);
      return `<button class="card ${taken?"taken":""} ${pk===c.key?"picked":""}" style="--st:${ST_COLOR[c.st]}" data-ui="selcrew" data-v="${c.key}" id="sel-${c.key}" ${taken?"disabled":""} aria-pressed="${pk===c.key}">
      ${faceCanvas(c.key)}<div class="nm">${c.name}<em>${c.role.toUpperCase()} · ${c.st}</em></div>
      <div class="full2"><span class="k">PASSIVE</span><span>${esc(c.passive)}</span><span class="k">ORDER · ${esc(c.order.toUpperCase())}</span><span>${esc(c.text)}</span></div></button>`; }).join("")}</div></div>`).join("")}
    <div class="btnrow">${pk?`<button class="go" data-m="R:${pk}" id="m-confirm-crew">Recruit ${CREW_BY[pk].name} ▸</button>`:`<button class="go" disabled>Choose a crew member</button>`}<button data-ui="randpick" id="btn-rand">Random pick</button>${undo}</div>`;

function storyHTML(){
  const st=G.story.slice(0,3);
  return `<div class="story" id="story" aria-live="polite"><h4>THE CHRONICLE</h4>${st.map((t,i)=>`<p class="${i?"old":""}">${esc(t)}</p>`).join("")}</div>`;
}
function paintStory(){ const el=document.getElementById("story"); if(el) el.outerHTML=storyHTML(); }
function shipCard(s){
  const active=s===S(G)&&G.st!=="over", cap=energyCap(s), used=energyUsed(s), pct=s.hp/s.maxHp, c=CLASSES[s.cls];
  const flags=[]; if(s.evasive) flags.push(["EVASIVE",""]); if(s.jammed) flags.push(["JAMMED","red"]); if(s.surge) flags.push([`SURGE +${s.surge}`,""]); if(s.autoBoost) flags.push(["AFTERBURN",""]);
  if(s.fury) flags.push(["SCRAP FURY",""]); if(s.chain) flags.push(["CHAIN SHOT",""]); if(s.tailwind) flags.push(["TAILWIND",""]); if(s.brace) flags.push(["BRACED",""]); if(s.storm) flags.push(["SANDSTORM −2","red"]);
  if(active&&G.phase==="ATK"&&s.f.locked) flags.push(["LOCKED",""]); if(active&&s.f.debuff) flags.push([`AIM ${s.f.debuff}`,"red"]);
  if(pct<R.HP_FAIL&&s.hp>0) flags.push(["HULL CRITICAL −1","red"]);
  const sysCell=([k,lab,dk])=>`<div class="stat"><span>${lab}</span>+${s.sys[k]}${s.dmg[dk]?` <span class="hurt" style="display:inline;font-family:var(--f-txt);font-size:18px">−${s.dmg[dk]}</span>`:""}</div>`;
  const canAct=active&&myTurn()&&!UI.busy, L=canAct?legal(G):[];
  const crew=s.crew.map((cm,i)=>{
    const d=CREW_BY[cm.key], block=orderBlock(G,s,cm), stt=cm.stun?["STUNNED","bad"]:cm.rest>0?(cm.used===G.turn?["ORDER GIVEN","dim"]:[`REST ${cm.rest}`,"dim"]):["READY","ok"];
    return `<div class="cm ${cm.stun?"stun":""}" style="--st:${ST_COLOR[d.st]}">${faceCanvas(cm.key)}
      <div><div class="nm">${d.name} <em>${d.st}</em></div><div class="tx">${esc(d.passive)}<br><b>${esc(d.order)}:</b> ${esc(d.text)}</div></div>
      <div><div class="stt ${stt[1]}">${stt[0]}</div>${active&&(MODE.mode==="local"||s.pid-1===MODE.seat)?`<button data-m="O:${i+1}" id="m-O-${s.pid}-${i+1}" ${L.includes("O:"+(i+1))?"":"disabled"} title="${esc(block||"Give order")}">Order</button>`:""}</div></div>`;
  }).join("");
  return `<section class="ship ${active?"active":""} ${s.hp<=0?"dead":""}" style="--c:${P_COLORS[s.pid-1]}">
    <h3><span class="shiphead">${shipCanvas(s.cls,s.pid,s.fac)}P${s.pid} · ${c?c.name.toUpperCase():""}${MODE.mode==="online"&&MODE.seat===s.pid-1?" (YOU)":""}</span><span>${s.hp}/${s.maxHp}</span></h3>
    <div class="flags">${facChip(s.fac)}<span class="flag" style="background:transparent;color:var(--dim)">${s.fac?esc(FACTIONS[s.fac].perk):""}${kindred(s)?` · KINDRED ${kindred(s)}`:""}</span></div>
    <div class="bar"><i class="${pct<HP_LOW?"lo":""}" style="width:${pct*100}%"></i></div>
    <div class="stats"><div class="stat"><span>ENERGY</span>${used}/${cap}</div><div class="stat"><span>AMMO</span>${s.ammo}</div><div class="stat"><span>PARTS</span>${s.parts}</div><div class="stat"><span>HEAD</span>${DIR_NAMES[s.o]}</div>
    ${SYS.map(sysCell).join("")}</div>
    ${flags.length?`<div class="flags">${flags.map(f=>`<span class="flag ${f[1]}">${f[0]}</span>`).join("")}</div>`:""}
    <div class="crew">${crew}</div></section>`;
}
function diceInner(){
  if(UI.rolling) return `<div class="die ${UI.rolling.sides!==20?"d6":""} rolling">${UI.rolling.shown}</div><div class="formula">Rolling d${UI.rolling.sides}…</div>`;
  const r=UI.shown||G.roll; if(!r) return `<div class="die" style="opacity:.25">20</div><div class="formula dim">No roll yet this turn.</div>`;
  let body;
  if(r.auto) body=`<b>${r.label}</b><br><span class="ok">AUTO-SUCCESS</span> <span class="dim">(Afterburn)</span>`;
  else {
    const m=(r.mods||[]).map(x=>` ${x[0]>0?"+":"−"}${Math.abs(x[0])} <span class="dim">${x[1]}</span>`).join("");
    const res=r.dmg?`<span class="bad">${r.total} damage</span>`:r.heal?`<span class="ok">+${r.total} hull</span>`:`${r.total} vs ${r.vs} → <span class="${r.ok?"ok":"bad"}">${r.ok?"SUCCESS":"FAIL"}</span>`;
    body=`<b>P${r.pid} ${r.label}</b><br>${r.die}${m} = ${res}`;
  }
  return `<div class="die ${r.sides!==20?"d6":""}">${r.auto?"✓":r.die}</div><div class="formula">${body}</div>`;
}
function paintDice(){ const d=document.getElementById("dicebox"); if(d) d.innerHTML=diceInner(); }
function btn(m,label,cls="",L){ return `<button class="${cls}" data-m="${m}" id="m-${m.replace(/[^A-Za-z0-9+-]/g,"-")}" ${L.includes(m)?"":"disabled"}>${label}</button>`; }
function fixNavSide(){
  const s=S(G); if(navOption(s,UI.speed,UI.side)) return;
  for(const d of [0,1,-1,2,-2,3,-3]) if(navOption(s,UI.speed,d)){ UI.side=d; return; }
  for(const sp of [1,2,3]) for(const d of [0,1,-1,2,-2,3,-3]) if(navOption(s,sp,d)){ UI.speed=sp; UI.side=d; return; }
}
function actionsHTML(){
  const s=S(G), L=myTurn()&&!UI.busy?legal(G):[], endLbl=G.qi+1<G.queue.length?"End phase ▸":"End turn ▸";
  const end=()=>btn("END",endLbl,"go",L);
  let p="",sub="",rows=[];
  switch(G.st){
    case "cmd": {
      const n=slotsAllowed(G);
      p="PLAN YOUR TURN"; sub=`Pick the order of ${n} phases.${s.jammed?" Your comms are jammed.":""} Chosen: ${G.queue.join(" → ")||"none"}`;
      rows.push(`<div class="btnrow">${["NAV","ATK","ENG"].map(x=>btn("Q:"+x,x,x.toLowerCase(),L)).join("")}${btn("Q-","Undo","",L)}</div>`); break; }
    case "nav_pick": {
      fixNavSide();
      const o=navOption(s,UI.speed,UI.side), ee=effEngine(s);
      p="NAVIGATION · SET COURSE"; sub=`Choose speed and turn, or tap a lit hex.${ee?` Engine +${ee} adds ${ee*R.ENG_DIST_BONUS} hexes and raises the DC.`:" Power the ENGINE in ENG to fly further."}`;
      const can=L.length>0;
      rows.push(`<div class="btnrow"><span class="lab">SPEED</span>${[1,2,3].map(v=>`<button data-ui="speed" data-v="${v}" id="ui-speed-${v}" class="${UI.speed===v?"sel":""}" ${can&&[-3,-2,-1,0,1,2,3].some(d=>navOption(s,v,d))?"":"disabled"}>${v}</button>`).join("")}</div>`);
      rows.push(`<div class="btnrow"><span class="lab">TURN</span>${[-3,-2,-1,0,1,2,3].map(v=>`<button data-ui="side" data-v="${v}" id="ui-side-${v}" class="${UI.side===v?"sel":""}" ${can&&navOption(s,UI.speed,v)?"":"disabled"}>${v>0?"+":""}${v}</button>`).join("")}</div>`);
      const bm=o?`B:${o.speed}:${o.side>0?"+":""}${o.side}`:"B:none";
      rows.push(`<div class="btnrow">${btn(bm,o?(s.autoBoost?"Afterburn ▸":`Roll boost · DC ${o.dc}`):"No open course","nav",L)}${L.includes("PIVOT:L")?btn("PIVOT:L","Pivot left","",L)+btn("PIVOT:R","Pivot right","",L):""}${btn("END","Skip move","",L)}</div>`);
      if(L.includes("PIVOT:L")) sub="Rocks block every course. Pivot in place, or skip the move.";
      break; }
    case "nav_drift": p="NAVIGATION · HOLD THE DRIFT"; sub=`Roll DRIFT vs DC ${G.dc}. Success lets you set a new heading and allows lock-on this turn.`;
      rows.push(`<div class="btnrow">${btn("DRIFT",`Roll drift · DC ${G.dc}`,"nav",L)}</div>`); break;
    case "nav_heading": {
      const h=previewHeading(), t=other(G,s), ai=t.hp>0?arcInfo({...s,o:h},t):null, can=L.length>0;
      p="NAVIGATION · CHOOSE HEADING";
      sub=`Pick a direction or tap the map, check the preview, then confirm. Facing ${DIR_NAMES[h]}${h===s.o?" (unchanged)":""}: ${ai?`P${t.pid} would be in your firing arc at range ${ai.range}.`:`P${t.pid} would be outside your firing arc.`}`;
      rows.push(`<div class="btnrow"><span class="lab">FACE</span>${DIR_NAMES.map((d,i)=>`<button data-ui="heading" data-v="${i}" id="ui-heading-${d}" class="${h===i?"sel":""}" ${can?"":"disabled"} aria-pressed="${h===i}"><span class="arr" aria-hidden="true">${ARROWS[i]}</span> ${d}</button>`).join("")}</div>`);
      rows.push(`<div class="btnrow">${btn("H:"+DIR_NAMES[h],`Confirm heading ${DIR_NAMES[h]} ▸`,"go",L)}</div>`);
      break; }
    case "done": p="PHASE COMPLETE"; rows.push(`<div class="btnrow">${end()}</div>`); break;
    case "atk_acquire": { const t=other(G,s), ai=arcInfo(s,t);
      p="COMBAT · ACQUIRE TARGET"; sub=ai?`P${t.pid} is in your firing arc at range ${ai.range}.`:`No ship in your arc (front, range 1–3). You can still reload.`;
      rows.push(`<div class="btnrow">${btn("TGT",`Target P${t.pid}`,"atk",L)}${btn("RLD","Reload","",L)}${end()}</div>`); break; }
    case "atk_menu": { const t=tgt(G), ai=arcInfo(s,t);
      p=`COMBAT · P${t.pid} AT RANGE ${ai?ai.range:"—"}`;
      sub=`Lock on (needs a stable drift): +${R.LOCK_BONUS} to hit and a critical. Fire: d20 vs AC ${ai?R.BASE_AC+R.AC_DIST[ai.range-1]:"—"}.`;
      rows.push(`<div class="btnrow">${btn("LOCK",s.f.drift?"Lock on":"Lock on (no drift)","",L)}${btn("RLD","Reload","",L)}${btn("FIRE",`Fire · ammo ${s.ammo}`,"atk",L)}${end()}</div>`); break; }
    case "atk_debuff": p="COMBAT · PICK A SYSTEM TO CRIPPLE"; sub="Applied if your next shot hits. CREW stuns a random enemy crew member.";
      rows.push(`<div class="btnrow">${DEBUFFS.map(([k,l])=>btn("AIM:"+k,l,"atk",L)).join("")}</div>`); break;
    case "atk_dmg": p="COMBAT · HIT!"; rows.push(`<div class="btnrow">${btn("DMG","Roll damage · d6","atk",L)}</div>`); break;
    case "eng": { const cap=energyCap(s), used=energyUsed(s);
      p=`ENGINEERING · ENERGY ${used}/${cap}`; sub="Power stays allocated between turns. Heavy hull damage lowers the cap.";

        return `<span class="sys">${lab}</span>${btn("-"+K,"−","",L)}<span>+${s.sys[k]}${k==="eng"?' <span class="dim">(max 2)</span>':""}</span>${btn("+"+K,"+","eng",L)}`; }).join("")}</div>`);
      rows.push(`<div class="btnrow">${btn("REP",`Repair · ${s.parts} parts`,"eng",L)}${end()}</div>`); break; }
  }
  if(UI.busy) sub="…";
  return `<div class="prompt">${p}${sub?`<span class="sub">${esc(sub)}</span>`:""}</div>${rows.join("")}`;
}
function recordHTML(){
  const ps=plies(G.seed,G.moves);
  return ps.map((p,i)=>`<div>${i+1}. <b style="color:${P_COLORS[p.who]}">P${p.who+1}</b> ${esc(plyText(p))}</div>`).reverse().join("");
}

      ${w?`<p class="dim">${CLASSES[w.cls].name} · crew ${w.crew.map(c=>CREW_BY[c.key].name).join(", ")}</p>`:""}
      ${MODE.mode==="online"&&UI.share?`<p class="dim">Send the final move so your friend sees the end:</p><textarea id="share-code" class="code" readonly>${esc(UI.shareText)}</textarea><button class="go" data-ui="copy" id="btn-copy">Copy move</button><span class="msg" id="copy-msg"></span>`:""}

      <p class="dim">${s.jammed?"Your comms are jammed: plan only 2 phases.":"Plan NAV, ATK and ENG in any order."}</p><button class="go" data-ui="begin" id="btn-begin">Begin turn</button></div></div>`;
  }
  if(!cv||!cv.isConnected){
    app.innerHTML=`<div id="hdr"></div><div class="main"><div class="col">
      <div class="screen"><canvas id="map" width="${W}" height="${H}" aria-label="Battle map"></canvas><div class="hud" id="hud"></div><div id="ovl"></div></div>
      <div id="storywrap"></div>
      <div class="console" id="console"></div><div class="log" id="log" aria-live="polite"></div>
      <details class="help" id="record-box"><summary>Game record</summary><div class="record" id="record"></div></details>
      <details class="help"><summary>Rules quick reference</summary><ul>
      <li>Rolls: d20 + modifiers must meet the DC or AC.</li><li>Boost fail: you overshoot by 50%. Drift fail: you spin one step and cannot lock on this turn.</li>
      <li>Rocks and rams deal 3 damage. Old-world wrecks give +1 spare part the first time a ship lands on them.</li>

      <li>Factions: Scrappers repair +1, Nomads rest less, Drifters +1 boost and drift. Each crew member of your faction adds +1 hull.</li></ul></details>
      </div><div class="col" id="side"></div></div>`;
    initCanvas(document.getElementById("map"));
  }
  document.getElementById("hdr").innerHTML=header();
  document.getElementById("ovl").innerHTML=overlay;
  document.getElementById("storywrap").innerHTML=storyHTML();
  document.getElementById("console").innerHTML=G.st==="over"?`<div class="prompt">GAME OVER</div>`:`<div class="split"><div style="flex:2 1 320px;display:flex;flex-direction:column;gap:10px;min-width:0">${actionsHTML()}</div><div class="dice" id="dicebox">${diceInner()}</div></div>`;
  document.getElementById("log").innerHTML=G.log.slice(0,40).map(l=>{
    const c=l.c==="ok"?"var(--good)":l.c==="bad"?"var(--bad)":l.c==="crew"?"var(--any)":l.c==="p1"?P_COLORS[0]:l.c==="p2"?P_COLORS[1]:"var(--ink)";
    return `<div style="color:${c}">${esc(l.t)}</div>`; }).join("");
  const rb=document.getElementById("record-box"); if(rb.open) document.getElementById("record").innerHTML=recordHTML();
  document.getElementById("side").innerHTML=G.ships.map(shipCard).join("");
  paintFaces(); paintShips();
}

app.addEventListener("toggle",e=>{ if(e.target.id==="record-box"&&e.target.open) document.getElementById("record").innerHTML=recordHTML(); },true);
app.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.dataset.m){ if(b.dataset.m==="B:none") return; await act(b.dataset.m); return; }
  const a=b.dataset.ui, v=b.dataset.v;
  switch(a){
    case "local": G=newGame(1+Math.floor(Math.random()*2e9)); MODE={mode:"local",seat:0}; UI.screen="game"; UI.share=null; UI.handoff=false; save(); break;
    case "online": G=newGame(1+Math.floor(Math.random()*2e9)); MODE={mode:"online",seat:0}; UI.screen="game"; UI.share=null; UI.msg=""; save(); break;
    case "continue": { const sv=loadSave(); if(!sv||!restore(sv)){ UI.joinMsg="The saved game could not be loaded."; } break; }
    case "join": { const t=document.getElementById("join-code").value; await importCode(t); return; }
    case "reply": { const t=document.getElementById("reply-code").value; await importCode(t); return; }
    case "copy": {
      const ta=document.getElementById("share-code"), msg=document.getElementById("copy-msg");
      try{ await navigator.clipboard.writeText(UI.shareText); msg.textContent="Copied."; }
      catch(err){ ta.focus(); ta.select(); msg.textContent="Press Ctrl+C (or ⌘C) to copy."; }
      return; }
    case "randpick": { const ls=legal(G).filter(m=>m.startsWith("R:")); UI.pickCrew=ls[Math.floor(Math.random()*ls.length)].slice(2); break; }
    case "begin": UI.handoff=false; break;
    case "speed": UI.speed=+v; fixNavSide(); break;
    case "side": UI.side=+v; break;
    case "heading": UI.heading=+v; break;
    case "selcls": UI.pickCls=v; break;
    case "selfac": UI.pickFac=v; break;
    case "selcrew": UI.pickCrew=v; break;
    case "undo": undoLast(); break;
    case "newgame": G=null; UI.screen="title"; UI.share=null; try{ localStorage.removeItem(SAVE_KEY); }catch(err){} break;
  }
  render();
});

// keep a running game across live page updates
window.claude?.hot?.snapshot?.(()=>({save:G?{seed:G.seed,moves:G.moves,mode:MODE.mode,seat:MODE.seat,share:UI.share,shareText:UI.shareText}:null}));
function start(data){
  const sv=(data&&data.save)||null;
  if(sv) restore(sv);
  render(); requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
