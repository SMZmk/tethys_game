<title>Tethys: Desert Drifter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: arcade cabinet — battlefield screen left, two ship dossiers right, command console under the screen. Single dark look on purpose. */
:root{
  --void:#0d0b14; --panel:#17141f; --panel2:#211c2d; --line:#3b3350; --line-hi:#5d5280;
  --ink:#efe6cf; --dim:#9a90b0; --sand:#d8b878;
  --nav:#3fa9f5; --atk:#f0503c; --eng:#f5a623; --any:#e8d04a;
  --good:#5be37a; --bad:#ff4d5e; --p1:#ffcf4a; --p2:#5fd0ff;
  --f-pix:"Press Start 2P", ui-monospace, monospace;
  --f-txt:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-txt);font-size:20px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font-family:var(--f-pix);font-size:10px;line-height:1.3;color:var(--ink);background:var(--panel2);
  border:2px solid var(--line-hi);padding:8px 10px;cursor:pointer;box-shadow:inset -2px -2px 0 #0006, inset 2px 2px 0 #fff1;
  text-transform:uppercase;letter-spacing:.04em}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--any);outline-offset:2px}
button:active:not(:disabled){box-shadow:inset 2px 2px 0 #0006}
button:disabled{opacity:.35;cursor:not-allowed}
button.sel{background:var(--ink);color:var(--void);border-color:var(--ink)}
button.go{background:#2a4a2f;border-color:var(--good)}
button.warn{background:#4a2224;border-color:var(--bad)}
button.nav{border-color:var(--nav)} button.atk{border-color:var(--atk)} button.eng{border-color:var(--eng)}
.pix{font-family:var(--f-pix)}
.app{max-width:1200px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.logo{font-family:var(--f-pix);font-size:16px;letter-spacing:.08em;color:var(--sand);text-shadow:2px 2px 0 #7a3b12}
.logo small{display:block;font-size:8px;color:var(--dim);letter-spacing:.2em;margin-top:6px;text-shadow:none}
.track{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.slot{font-family:var(--f-pix);font-size:9px;padding:6px 8px;border:2px solid var(--line);color:var(--dim);min-width:46px;text-align:center}
.slot.on{color:var(--void)}
.turnchip{font-family:var(--f-pix);font-size:10px;padding:7px 10px;border:2px solid currentColor}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.screen{position:relative;border:3px solid var(--line-hi);background:#000;box-shadow:0 0 0 3px #000, 6px 6px 0 3px #0008;line-height:0}
.screen canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair;touch-action:manipulation}
.hud{position:absolute;left:8px;bottom:8px;font-family:var(--f-pix);font-size:8px;line-height:1.4;color:var(--ink);background:#0d0b14cc;padding:6px 8px;pointer-events:none;max-width:70%}
.hud:empty{display:none}

.console{background:var(--panel);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.prompt{font-family:var(--f-pix);font-size:10px;line-height:1.6;color:var(--sand)}
.prompt .sub{display:block;font-family:var(--f-txt);font-size:20px;color:var(--dim);line-height:1.1;margin-top:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btnrow .lab{font-family:var(--f-pix);font-size:8px;color:var(--dim);min-width:52px}
.split{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.split>*{min-width:0}
.dice{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;flex:1 1 260px}
.die{width:44px;height:44px;flex:none;display:grid;place-items:center;font-family:var(--f-pix);font-size:14px;color:var(--void);background:var(--ink);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.die.d6{clip-path:none;border-radius:0;box-shadow:inset -3px -3px 0 #0004}
.die.rolling{animation:shake .12s steps(2) infinite}
@keyframes shake{0%{transform:translate(-1px,1px) rotate(-6deg)}100%{transform:translate(1px,-1px) rotate(6deg)}}
.formula{font-size:20px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.formula b{font-weight:normal;font-family:var(--f-pix);font-size:9px}
.ok{color:var(--good)} .bad{color:var(--bad)} .dim{color:var(--dim)}
.log{background:#09080e;border:2px solid var(--line);padding:8px 10px;font-size:19px;line-height:1.1;height:150px;overflow-y:auto;display:flex;flex-direction:column-reverse}
.log div{white-space:pre-wrap;overflow-wrap:anywhere}
.eng-grid{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px 10px;align-items:center}
.eng-grid .sys{font-family:var(--f-pix);font-size:9px}

/* ship dossiers */
.ship{background:var(--panel);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.ship.active{border-color:var(--c);box-shadow:4px 4px 0 0 var(--c)}
.ship.dead{opacity:.45}
.ship h3{margin:0;font-family:var(--f-pix);font-size:11px;color:var(--c);display:flex;justify-content:space-between;gap:8px}
.bar{height:12px;background:#2a0f14;border:2px solid #000;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.bar i.lo{background:var(--bad)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/13 - 2px),#0008 calc(100%/13 - 2px) calc(100%/13))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-variant-numeric:tabular-nums}
.stat{background:var(--panel2);padding:3px 5px;font-size:18px;line-height:1}
.stat span{display:block;font-family:var(--f-pix);font-size:7px;color:var(--dim);margin-bottom:3px}
.stat .hurt{color:var(--bad)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flag{font-family:var(--f-pix);font-size:7px;padding:3px 5px;background:#3a2f10;color:var(--any)}
.flag.red{background:#3d1418;color:var(--bad)}
.crew{display:flex;flex-direction:column;gap:6px}
.cm{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 8px;align-items:start;background:var(--panel2);padding:6px;border-left:4px solid var(--st)}
.cm canvas,.card canvas{width:40px;height:40px;image-rendering:pixelated;background:#100e18;border:2px solid #000}
.cm .nm{font-family:var(--f-pix);font-size:8px;line-height:1.5}
.cm .nm em{font-style:normal;color:var(--st)}
.cm .tx{font-size:17px;line-height:1.05;color:var(--dim)}
.cm .tx b{font-weight:normal;color:var(--ink)}
.cm .stt{font-family:var(--f-pix);font-size:7px;text-align:right}
.cm button{padding:5px 6px;font-size:8px;margin-top:4px}
.cm.stun canvas{filter:grayscale(1) brightness(.6)}

/* full screens */
.full{background:var(--panel);border:3px solid var(--line-hi);padding:20px;display:flex;flex-direction:column;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:800px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--f-pix);font-size:clamp(22px,5vw,40px);margin:0;color:var(--sand);text-shadow:4px 4px 0 #7a3b12;letter-spacing:.06em;line-height:1.2}
.hero h1 small{display:block;font-size:11px;color:var(--atk);text-shadow:none;letter-spacing:.3em;margin-top:12px}
.hero p{max-width:60ch;margin:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rule{background:var(--panel2);padding:10px;border-top:4px solid var(--c)}
.rule h4{margin:0 0 6px;font-family:var(--f-pix);font-size:9px;color:var(--c)}
.rule p{margin:0;font-size:18px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel2);border:2px solid var(--st);padding:10px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:6px 10px;text-align:left;font-family:var(--f-txt);font-size:18px;text-transform:none;letter-spacing:0;line-height:1.05}
.card canvas{width:48px;height:48px}
.card .nm{font-family:var(--f-pix);font-size:10px;line-height:1.5}
.card .nm em{display:block;font-style:normal;font-size:8px;color:var(--st)}
.card .full2{grid-column:1/-1;display:flex;flex-direction:column;gap:3px}
.card .k{font-family:var(--f-pix);font-size:7px;color:var(--dim)}
.card.taken{opacity:.25;filter:grayscale(1)}
.picks{display:flex;flex-wrap:wrap;gap:16px}
.picks div{font-family:var(--f-pix);font-size:9px;line-height:1.8}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0d0b14d0;line-height:1.2;padding:12px}
.overlay .box{background:var(--panel);border:3px solid var(--c);padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px}
.overlay h2{font-family:var(--f-pix);font-size:clamp(12px,2.6vw,18px);color:var(--c);margin:0;line-height:1.4}
details.help{background:var(--panel);border:2px solid var(--line);padding:8px 10px}
details.help summary{font-family:var(--f-pix);font-size:9px;cursor:pointer;color:var(--sand)}
details.help ul{margin:8px 0 0;padding-left:20px;font-size:18px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}}
</style>

<div class="app" id="app"></div>

<script>
"use strict";
// ======================================================================
// RULES (port of settings.py / mechanics.py / crew.py)
// ======================================================================
const R = {
  MAX_HP:26, START_ENERGY:3, START_PARTS:2, START_AMMO:1,
  DC_BASE:8, DC_MOD_EASY:1, DC_MOD_HARD:2, ENG_DIST_BONUS:2, ENG_DC_MULT:0.5,
  BASE_AC:12, AC_DIST:[0,2,4], DMG_BONUS:4, LOCK_DC:8, LOCK_BONUS:4,
  HP_CRIT:0.40, HP_FAIL:0.20, CRASH_DMG:5, REST:2,
};
const DIRS = [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const DIR_NAMES = ["N","NE","SE","S","SW","NW"];
const SYS = [["eng","ENGINE","SPEED"],["bst","BOOST","BOOST"],["dft","DRIFT","DRIFT"],["wpn","WEAPONS","WEAPONS"]];
const DEBUFFS = [["SPEED","SPD"],["BOOST","BST"],["DRIFT","DFT"],["WEAPONS","WPN"],["CREW","CREW"]];
const mod = (a,n)=>((a%n)+n)%n;

const hexDist = (q,r)=>(Math.abs(q)+Math.abs(q+r)+Math.abs(r))/2;
function hexRound(q,r){
  const x=q,z=r,y=-x-z; let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return [rx,rz];
}
function ring(radius){
  if(radius===0) return [[0,0]];
  let q=DIRS[4][0]*radius, r=DIRS[4][1]*radius; const out=[];
  for(let i=0;i<6;i++) for(let j=0;j<radius;j++){ out.push([q,r]); q+=DIRS[i][0]; r+=DIRS[i][1]; }
  return out;
}
const idxOf=(rg,q,r)=>rg.findIndex(c=>c[0]===q&&c[1]===r);
function navToCoords(dir,side,speed){
  const d=speed+1, rg=ring(d), s=idxOf(rg,DIRS[dir][0]*d,DIRS[dir][1]*d);
  return s<0?[0,0]:rg[mod(s+side,rg.length)];
}
function relInfo(q,r,dir){
  const d=Math.trunc(hexDist(q,r)); if(d===0) return [0,-1];
  const rg=ring(d), s=idxOf(rg,DIRS[dir][0]*d,DIRS[dir][1]*d), t=idxOf(rg,q,r);
  if(s<0||t<0) return [null,null];
  let diff=t-s; const n=rg.length;
  if(diff>n/2) diff-=n; else if(diff<-n/2) diff+=n;
  return [diff,d-1];
}
function noise(q,r,scale,seed){ const v=Math.sin((q/scale)*12.9898+(r/scale)*78.233+seed)*43758.5453; return Math.abs(v-Math.trunc(v)); }
const obsCache=new Map();
function obstacleType(q,r){
  const k=(q+4096)*8192+(r+4096); let v=obsCache.get(k); if(v!==undefined) return v;
  v=0;
  if(!(q===0&&r===0)){
    const c=noise(q,r,5,0.123)*0.7+noise(q,r,1.5,9.876)*0.3;
    if(c>0.72){ const b=noise(q,r,15,42.1337); v=b<0.33?1:b<0.66?2:3; }
  }
  obsCache.set(k,v); return v;
}
const isObstacle=(q,r)=>obstacleType(q,r)>0;
function angleDifficulty(dir,tq,tr,sq,sr){
  if(isObstacle(sq+tq,sr+tr)) return [0,false];
  const [side,speed]=relInfo(tq,tr,dir);
  if(side===null) return [0,true];
  const d=speed+1; if(d===0) return [0,true];
  const dev=Math.abs(side)/d;
  if(dev<0.5) return [0,true]; if(dev<=1) return [R.DC_MOD_EASY,true]; if(dev<=1.5) return [R.DC_MOD_HARD,true];
  return [0,false];
}

// ---------------- CREW ----------------
const CREW = [
  {key:"CAPTAIN",name:"RHO",role:"Captain",st:"ANY",passive:"+1 to all rolls",order:"Battle Stations",text:"Repeat this phase once",pal:["#e0b088","#e8e8f0","#283878","#f8c828"]},
  {key:"ACE",name:"VEX",role:"Ace Pilot",st:"NAV",passive:"+2 boost rolls",order:"Afterburn",text:"Next boost auto-succeeds",pal:["#f0c098","#c84020","#1870a8","#78e8f8"]},
  {key:"DRIFTER",name:"ORO",role:"Navigator",st:"NAV",passive:"+2 drift rolls",order:"Evasive",text:"Enemy attacks −3 until your next turn",pal:["#b07850","#181820","#208878","#a0f8c8"]},
  {key:"GUNNER",name:"KAEL",role:"Gunner",st:"ATK",passive:"+2 attack rolls",order:"Double Tap",text:"+1 ammo, fire again",pal:["#d09870","#583820","#902828","#f87828"]},
  {key:"SPOTTER",name:"NYX",role:"Spotter",st:"ATK",passive:"+3 lock rolls",order:"Auto-Lock",text:"Instant lock, no roll",pal:["#f0d0b0","#7850c8","#403060","#f840a0"]},
  {key:"JAMMER",name:"ZED",role:"Jammer",st:"ATK",passive:"Enemy locks on you −2",order:"Jam Comms",text:"Target plans only 2 phases next turn",pal:["#986848","#28c848","#202830","#40f860"]},
  {key:"MECHANIC",name:"BRAKK",role:"Mechanic",st:"ENG",passive:"Repair heals +2",order:"Field Fix",text:"All system damage −1",pal:["#c89068","#e87800","#785828","#f8c850"]},
  {key:"TECH",name:"IVO",role:"Reactor Tech",st:"ENG",passive:"+1 energy cap",order:"Surge",text:"Next roll this turn +5",pal:["#e8b898","#28a0e8","#384048","#78e8f8"]},
  {key:"QM",name:"SAL",role:"Quartermaster",st:"ENG",passive:"+1 part; reload gives 2 ammo",order:"Salvage",text:"+2 spare parts",pal:["#b88860","#888888","#586838","#e8d878"]},
];
const CREW_BY = Object.fromEntries(CREW.map(c=>[c.key,c]));
const ST_COLOR = {NAV:"var(--nav)",ATK:"var(--atk)",ENG:"var(--eng)",ANY:"var(--any)"};
const PORTRAIT = ["...hhhhhh...","..hhhhhhhh..",".hhhsssshhh.",".hhssssssh..","..sesssesa..","..ssssssss..",
  "...ssaass...","....ssss....","..uuuaauuu..",".uuuuaauuuu.","uuuauuuuauuu","uuuuuuuuuuuu"];

// ======================================================================
// STATE
// ======================================================================
let G;
function newShip(pid,q,r,o){
  return {pid,q,r,o,hp:R.MAX_HP,maxHp:R.MAX_HP,baseEnergy:R.START_ENERGY,parts:R.START_PARTS,ammo:R.START_AMMO,
    sys:{eng:0,bst:0,dft:0,wpn:0},dmg:{SPEED:0,BOOST:0,DRIFT:0,WEAPONS:0},
    f:{targeted:false,reloaded:false,fired:false,drift:false,locked:false,debuff:null},
    crew:[],evasive:false,jammed:false,surge:0,autoBoost:false};
}
function newGame(){
  G={screen:"draft",ships:[newShip(1,0,5,0),newShip(2,0,-5,3)],active:0,
    draft:{pool:CREW.map(c=>c.key),order:[0,1,1,0,0,1],idx:0},
    phase:"CMD",queue:[],qi:0,repeated:false,st:"cmd",
    nav:{speed:1,side:0},target:null,dc:0,dest:null,
    log:[],handoff:false,roll:null,winner:null};
  log("Crew draft. Player 1 picks first.");
}
const S = ()=>G.ships[G.active];
const other = s=>G.ships.find(x=>x!==s);
function log(t,c=""){ G.log.unshift({t,c}); if(G.log.length>60) G.log.pop(); }
const shipName = s=>"P"+s.pid;

// ---- derived values ----
const has=(s,key)=>s.crew.some(c=>c.key===key&&!c.stun);
function energyCap(s){ const p=s.hp/s.maxHp; if(p<R.HP_FAIL) return 0; if(p<R.HP_CRIT) return 1; return s.baseEnergy+(has(s,"TECH")?1:0); }
const energyUsed=s=>s.sys.eng+s.sys.bst+s.sys.dft+s.sys.wpn;
const hullPen=s=>(s.hp/s.maxHp<R.HP_FAIL?-1:0);
const effEngine=s=>Math.max(0,s.sys.eng-s.dmg.SPEED);
function integrity(s){
  const cap=energyCap(s);
  if(energyUsed(s)>cap){
    log(`${shipName(s)} power failure! Cap dropped to ${cap}.`,"bad");
    s.sys={eng:0,bst:0,dft:0,wpn:0};
    if(cap===1){ s.sys.eng=1; log("Emergency power to engines."); }
  }
}
function crewMods(s,kind,target,consume){
  const m=[];
  if(has(s,"CAPTAIN")) m.push([1,"RHO"]);
  if(kind==="BOOST"&&has(s,"ACE")) m.push([2,"VEX"]);
  if(kind==="DRIFT"&&has(s,"DRIFTER")) m.push([2,"ORO"]);
  if(kind==="ATK"&&has(s,"GUNNER")) m.push([2,"KAEL"]);
  if(kind==="LOCK"&&has(s,"SPOTTER")) m.push([3,"NYX"]);
  if(s.surge>0){ m.push([s.surge,"surge"]); if(consume) s.surge=0; }
  if(target){
    if(kind==="LOCK"&&has(target,"JAMMER")) m.push([-2,"jammer"]);
    if(kind==="ATK"&&target.evasive) m.push([-3,"evasive"]);
  }
  return m;
}

// ======================================================================
// TURN FLOW
// ======================================================================
function startTurn(idx){
  G.active=idx; const s=S();
  s.f={targeted:false,reloaded:false,fired:false,drift:false,locked:false,debuff:null};
  s.evasive=false; s.crew.forEach(c=>{ if(c.rest>0) c.rest--; });
  G.repeated=false; G.phase="CMD"; G.queue=[]; G.qi=0; G.st="cmd"; G.target=null; G.roll=null;
  log(`— Turn: Player ${s.pid} —`,"p"+s.pid);
  if(s.jammed) log(`${shipName(s)} comms jammed: only 2 phases.`,"bad");
  integrity(s);
  G.handoff=true;
}
function endTurn(){
  const s=S();
  s.jammed=false; s.surge=0; s.autoBoost=false; s.crew.forEach(c=>c.stun=false);
  startTurn(G.ships.indexOf(other(s)));
}
const slotsAllowed=()=>S().jammed?2:3;
function pickPhase(p){
  if(G.queue.includes(p)) return;
  G.queue.push(p);
  if(G.queue.length===slotsAllowed()){ log("Sequence locked: "+G.queue.join(" → ")); beginPhase(0); }
}
function beginPhase(i){
  G.qi=i; G.phase=G.queue[i]; G.target=null; const s=S();
  if(G.phase==="NAV"){ G.st="nav_pick"; G.nav={speed:1,side:0}; fixNavSide(); }
  if(G.phase==="ATK"){ Object.assign(s.f,{targeted:false,reloaded:false,fired:false,locked:false,debuff:null}); G.st="atk_acquire"; }
  if(G.phase==="ENG"){ G.st="eng"; }
}
function endPhase(){
  if(G.qi+1<G.queue.length) beginPhase(G.qi+1); else endTurn();
}

// ---------------- NAV ----------------
function navOption(s,speed,side){
  const ee=effEngine(s), total=speed+ee*R.ENG_DIST_BONUS;
  const [rq,rr]=navToCoords(s.o,side,total-1);
  const [m,ok]=angleDifficulty(s.o,rq,rr,s.q,s.r);
  if(!ok) return null;
  return {speed,side,q:s.q+rq,r:s.r+rr,dc:Math.trunc((R.DC_BASE+total+m)*(1+ee*R.ENG_DC_MULT))};
}

function orderBlock(s,c){
  const d=CREW_BY[c.key];

  if(c.stun) return "Stunned";
  if(c.rest>0) return `Resting ${c.rest}`;
  if(G.phase==="CMD") return "Plan phases first";
  if(d.st!=="ANY"&&d.st!==G.phase) return `${d.st} phase only`;
  if(G.st==="moving"||G.roll&&G.roll.rolling) return "Wait";

let terrainKey="";
function drawTerrain(cs){

    const [x,y]=toScreen(o.q,o.r);
    if(x<6||x>W-6||y<6||y>H-6){
      const cx=W/2,cy=H/2,a=Math.atan2(y-cy,x-cx);
      const k=Math.min((W/2-12)/Math.abs(Math.cos(a)||1e-6),(H/2-12)/Math.abs(Math.sin(a)||1e-6));
      const px=cx+Math.cos(a)*k, py=cy+Math.sin(a)*k;
      ctx.save(); ctx.translate(Math.round(px),Math.round(py)); ctx.rotate(a);
      ctx.fillStyle=P_COLORS[o.pid-1]; ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-5); ctx.lineTo(-4,5); ctx.fill(); ctx.restore();
      ctx.font='8px "Press Start 2P"'; ctx.fillStyle=P_COLORS[o.pid-1];
      const dtx=`P${o.pid} ${hexDist(o.q-s.q,o.r-s.r)}`; const tw=ctx.measureText(dtx).width;
      ctx.fillText(dtx,Math.max(2,Math.min(W-tw-2,Math.round(px-Math.cos(a)*14-tw/2))),Math.max(10,Math.min(H-3,Math.round(py-Math.sin(a)*14+4))));
    }
  }
  // shots
  shots=shots.filter(sh=>{
    const t=(now-sh.t0)/320; if(t>1.3) return false;
    const tt=Math.min(1,t), x=sh.a[0]+(sh.b[0]-sh.a[0])*tt, y=sh.a[1]+(sh.b[1]-sh.a[1])*tt;
    const [px,py]=[Math.round(x-cam.x+W/2),Math.round(y-cam.y+H/2)];
    ctx.fillStyle="#fff"; ctx.fillRect(px-1,py-1,3,3); ctx.fillStyle=sh.col;
    for(let k=1;k<5;k++){ const t2=Math.max(0,tt-k*.05); ctx.fillRect(Math.round(sh.a[0]+(sh.b[0]-sh.a[0])*t2-cam.x+W/2),Math.round(sh.a[1]+(sh.b[1]-sh.a[1])*t2-cam.y+H/2),2,2); }
    return true;
  });
  parts=parts.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=.95; p.vy*=.95; p.l--; ctx.fillStyle=p.c; ctx.fillRect(Math.round(p.x-cam.x+W/2),Math.round(p.y-cam.y+H/2),2,2); return p.l>0; });
  ctx.font='8px "Press Start 2P"'; ctx.textBaseline="alphabetic";
  floats=floats.filter(f=>{ f.l--; f.y-=.35; const tw=ctx.measureText(f.t).width, x=Math.round(f.x-cam.x+W/2-tw/2), y=Math.round(f.y-cam.y+H/2);
    ctx.fillStyle="#000"; ctx.fillText(f.t,x+1,y+1); ctx.fillStyle=f.c; ctx.fillText(f.t,x,y); return f.l>0; });
  // dust
  const moving=G.st==="moving";
  for(const p of dust){ p.x+=p.s*(moving?6:1); p.y+=p.s*(moving?6:1)*.6; if(p.x>W) p.x-=W; if(p.y>H) p.y-=H;
    ctx.fillStyle=p.c<.33?"#8a7a5a":p.c<.66?"#b8a078":"#e0caa0"; ctx.fillRect(p.x|0,p.y|0,1,1); }
  cam.x=saved.x; cam.y=saved.y;
  // hover tooltip
  const hud=document.getElementById("hud");
  if(hud){
    let t="";
    if(hover&&!G.handoff){
      const [q,r]=hover, dq=q-s.q, dr=r-s.r, ob=obstacleType(q,r);
      if(G.st==="nav_pick"){ const o=allNavOptions(s).find(x=>x.q===q&&x.r===r); if(o) t=`SPEED ${o.speed} · TURN ${o.side>0?"+":""}${o.side} · DC ${o.dc}`; }
      if(!t){ const sh=G.ships.find(x=>x.hp>0&&x.q===q&&x.r===r&&x!==s); if(sh){ const ai=arcInfo(s,sh); t=`P${sh.pid} · ${hexDist(dq,dr)} HEX · ${ai?"IN ARC, RANGE "+ai.range:"OUT OF ARC"}`; } }
      if(!t&&ob) t=["","SLATE ROCK","RUST MESA","TAR PIT"][ob]+" · 5 DMG";
    }
    if(hud.textContent!==t) hud.textContent=t;
  }
}
const HP_LOW=0.4;
function drawX(x,y,c){ ctx.fillStyle=c; for(let k=-4;k<=4;k++){ ctx.fillRect(x+k,y+k,1,1); ctx.fillRect(x+k,y-k,1,1);} }
function hexOutline(x,y,s){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/3*i; const px=x+s*Math.cos(a)+.5, py=y+s*Math.sin(a)+.5; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.stroke(); }

app.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case "start": newGame(); break;
    case "pick": draftPick(v); return;
    case "randpick": draftPick(G.draft.pool[Math.floor(Math.random()*G.draft.pool.length)]); return;
    case "begin": G.handoff=false; break;
    case "phase": pickPhase(v); break;
    case "undo": G.queue.pop(); break;
    case "speed": G.nav.speed=+v; fixNavSide(); break;
    case "side": G.nav.side=+v; break;
    case "boost": doBoost(); return;
    case "drift": doDrift(); return;
    case "head": S().o=+v; log(`Heading locked: ${DIR_NAMES[+v]}.`); G.st="done"; break;
    case "end": endPhase(); break;
    case "acquire": acquire(); break;
    case "reload": doReload(); break;
    case "lock": doLock(); return;
    case "fire": doFire(); return;
    case "debuff": chooseDebuff(v); break;
    case "dmg": doDamage(); return;
    case "sysp": sysAdd(v,1); break;
    case "sysm": sysAdd(v,-1); break;
    case "repair": doRepair(); break;
    case "order": useOrder(+v); return;
    case "rematch": newGame(); break;
  }
  render();
});

// keep a running game across live page updates
window.claude?.hot?.snapshot?.(()=>({G}));
function start(data){
  if(data&&data.G){ G=data.G; if(G.roll) G.roll.rolling=false; if(G.st==="moving"&&G.dest){ const s=S(); s.q=G.dest.q; s.r=G.dest.r; G.st="nav_drift"; } }
  else G={screen:"title",ships:[],log:[]};
  render(); requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
